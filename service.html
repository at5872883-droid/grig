<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Услуга — Евгений</title>
<meta name="description" content="Описание услуги: что входит, срок, цена и как заказать.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-head">
  <div class="wrap head-in">
    <a class="brand" href="index.html"><span data-shop>ЕВГЕНИЙ</span></a>
    <nav class="nav" aria-label="Основная навигация">
      <a href="index.html">Главная</a>
      <a href="services.html">Услуги</a>
      <a href="about.html">Обо мне</a>
      <a href="about.html#contacts">Контакты</a>
    </nav>
    <div class="head-cta">
      <a class="btn btn-ghost btn-sm" data-avito href="https://www.avito.ru/profile" target="_blank" rel="noopener">На Авито</a>
      <a class="btn btn-accent btn-sm" data-tg href="https://t.me/grig000jr" target="_blank" rel="noopener">Написать в Telegram</a>
    </div>
  </div>
</header>

<main class="item">
  <div class="wrap">
    <nav class="crumbs" aria-label="Хлебные крошки">
      <a href="index.html">Главная</a> <span>/</span> <a href="services.html">Услуги</a> <span>/</span> <span id="crumb">Услуга</span>
    </nav>

    <div id="item-root"></div>

    <section class="section" style="padding-bottom:0">
      <div class="section-head">
        <div><h2>Другие услуги</h2></div>
        <a class="link-arrow" href="services.html">Все услуги →</a>
      </div>
      <div class="grid" id="similar"></div>
    </section>
  </div>
</main>

<footer class="site-foot">
  <div class="wrap foot-in">
    <div>
      <a class="brand" href="index.html" style="font-size:17px"><span data-shop>ЕВГЕНИЙ</span></a>
      <p style="margin-top:8px" data-text="footer.note"></p>
    </div>
    <div class="foot-links">
      <a href="index.html">Главная</a>
      <a href="services.html">Услуги</a>
      <a data-tg href="https://t.me/grig000jr" target="_blank" rel="noopener">Telegram</a>
      <a data-avito href="https://www.avito.ru/profile" target="_blank" rel="noopener">Авито</a>
      <a href="admin.html">Админка</a>
    </div>
    <div>© <span data-year>2026</span> <span data-shop>ЕВГЕНИЙ</span></div>
  </div>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var id = UI.query("id");
  var s = id ? Store.find(id) : null;
  var root = document.getElementById("item-root");

  if (!s) {
    root.innerHTML = '<div class="empty"><h3>Услуга не найдена</h3><p>Ссылка устарела или услуга снята.</p><p style="margin-top:16px"><a class="btn btn-accent" href="services.html">Все услуги</a></p></div>';
    document.getElementById("similar").innerHTML = "";
    return;
  }

  document.title = s.title + " — " + (Store.settings().shopName || "Евгений");
  document.getElementById("crumb").textContent = s.title;

  var st = Store.settings();
  var tgn = String(st.tg || "grig000jr").replace(/^@/, "");
  var msg = "Здравствуйте! Интересует услуга «" + s.title + "» (" + Store.priceLine(s) + ") с сайта.";
  var includes = (s.includes || []).map(function (x) { return "<li>" + UI.esc(x) + "</li>"; }).join("");
  var priceNote = s.priceNote ? '<span class="price-note">' + UI.esc(s.priceNote) + "</span> " : "";

  root.innerHTML =
    '<div class="item-grid">' +
      '<div>' +
        '<div class="gallery-main"><img id="gal-main" src="' + UI.esc(UI.cover(s)) + '" alt="' + UI.esc(s.title) + '"></div>' +
        '<div class="gallery-thumbs" id="gal-thumbs"></div>' +
      "</div>" +
      '<div class="item-side">' +
        '<span class="eyebrow">' + UI.esc(s.category || "Услуга") + "</span>" +
        "<h1>" + UI.esc(s.title) + "</h1>" +
        '<div class="item-price">' + priceNote + Store.money(s.price) + "</div>" +
        '<div class="meta-row">' +
          '<span class="meta">Срок: ' + UI.esc(s.term || "по задаче") + "</span>" +
          '<span class="meta">Работа по предоплате</span>' +
          (st.city ? '<span class="meta">' + UI.esc(st.city) + "</span>" : "") +
        "</div>" +
        '<div class="item-actions">' +
          '<a class="btn btn-accent" href="' + Store.tg(tgn, msg) + '" target="_blank" rel="noopener">Обсудить в Telegram</a>' +
          '<a class="btn" data-avito href="' + UI.esc(st.avito || "https://www.avito.ru/profile") + '" target="_blank" rel="noopener">Смотреть на Авито</a>' +
        "</div>" +
        '<div class="desc">' + UI.esc(s.description || "Описание не заполнено.") + "</div>" +
        (includes ? '<ul class="includes">' + includes + "</ul>" : "") +
      "</div>" +
    "</div>";

  UI.gallery(s.images);

  var others = Store.services().filter(function (x) { return x.id !== s.id && x.status === "active"; }).slice(0, 4);
  UI.fill("#similar", others, "Других услуг пока нет.");
})();
</script>
</body>
</html>
